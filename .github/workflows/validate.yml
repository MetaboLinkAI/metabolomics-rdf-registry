name: Validate registry

on:
  pull_request:
    paths:
      - "data/endpoints/**"
      - "schema/**"
      - "scripts/**"
      - "index.html"
      - "requirements.txt"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate registry metadata
        run: python scripts/validate_endpoints.py
      - name: Verify generated catalogue is current
        run: |
          python scripts/build_site.py
          git diff --exit-code -- data.json
